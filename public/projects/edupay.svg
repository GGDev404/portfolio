<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#0a0e0d"/>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1f2b27"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <text x="90" y="300" font-family="monospace" font-size="34" fill="#00e5a0">$ stripe listen --forward-to</text>
  <text x="90" y="350" font-family="monospace" font-size="34" fill="#e7ece9">/webhooks/payments</text>
  <text x="90" y="420" font-family="monospace" font-size="24" fill="#8a938f">POST /api/payments/subscribe  200 OK</text>
  <text x="90" y="460" font-family="monospace" font-size="24" fill="#8a938f">POST /webhooks/stripe          200 OK</text>
  <text x="90" y="560" font-family="sans-serif" font-size="46" font-weight="700" fill="#e7ece9">EduPay</text>
  <text x="90" y="600" font-family="monospace" font-size="22" fill="#00e5a0">NestJS · Stripe · JWT · PostgreSQL</text>
</svg>
